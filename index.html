<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <title>Logo Natural</title>
 <style>
 body {
 margin: 0;
 height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 background-color: #F5F5DC; /* bege */
 font-family: Arial, sans-serif;
 }
 .logo-container {
 text-align: center;
 }
 svg {
 width: 300px;
 height: 300px;
 }
 .title {
 margin-top: 15px;
 font-size: 24px;
 color: #6B8E23; /* verde oliva */
 letter-spacing: 2px;
 }
 </style>
</head>
<body>
<div class="logo-container">
 <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
 <!-- Ramos -->
 <path d="M100 180 C90 140, 70 120, 60 80" stroke="#8B5E3C" stroke-width="1.5"
fill="none"/>
 <path d="M100 180 C110 140, 130 120, 140 80" stroke="#8B5E3C" stroke-width="1.5"
fill="none"/>
 <!-- Folhas esquerda -->
 <path d="M60 80 C50 70, 50 60, 65 60 C75 65, 70 75, 60 80 Z"
 fill="#A8D5BA" stroke="#6B8E23" stroke-width="1"/>
 <path d="M75 100 C65 90, 65 80, 80 80 C90 85, 85 95, 75 100 Z"
 fill="#A8D5BA" stroke="#6B8E23" stroke-width="1"/>
 <!-- Folhas direita -->
 <path d="M140 80 C150 70, 150 60, 135 60 C125 65, 130 75, 140 80 Z"
 fill="#A8D5BA" stroke="#6B8E23" stroke-width="1"/>
 <path d="M125 100 C135 90, 135 80, 120 80 C110 85, 115 95, 125 100 Z"
 fill="#A8D5BA" stroke="#6B8E23" stroke-width="1"/>
 <!-- Elemento orgânico central -->
 <path d="M100 140 C85 120, 85 100, 100 90 C115 100, 115 120, 100 140 Z"
 fill="#6B8E23" opacity="0.2"/>
 </svg>
 <h1>Sejam Bem Vindos</h1>
 <div class="title">NATURAL BRAND</div>
</div>
<strong>ECO 2000</strong>

</body>
</html>
